{{ define "main" }}
<section class="wrap page-space">
  <header class="page-header"><p class="eyebrow">Dolittle</p><h1>Writing</h1><div class="lead">{{ .Content }}</div><a class="text-link" href="{{ "writing/index.xml" | relURL }}">Follow by RSS <span aria-hidden="true">↗</span></a></header>
  <div class="writing-list">{{ range .RegularPages.ByDate.Reverse }}{{ partial "writing-entry.html" (dict "page" . "heading" "h2") }}{{ end }}</div>
</section>
{{ end }}
